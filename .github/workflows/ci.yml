name: CI/CD — Embrace Health Grid

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: "20"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# ════════════════════════════════════════════════════════════════
#  JOBS
# ════════════════════════════════════════════════════════════════
jobs:

  # ──────────────────────────────────────────────────────────────
  #  1. Lint & Type-check (frontend)
  # ──────────────────────────────────────────────────────────────
  lint:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check Prettier formatting
        run: npx prettier --check "src/**/*.{ts,tsx,js,jsx,css}"

  # ──────────────────────────────────────────────────────────────
  #  2. Build frontend
  # ──────────────────────────────────────────────────────────────
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'http://localhost:3001' }}
          VITE_CLIENT_KEY: ${{ secrets.VITE_CLIENT_KEY || 'ci-placeholder' }}
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL || '' }}
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 7

  # ──────────────────────────────────────────────────────────────
  #  3. Backend smoke tests
  # ──────────────────────────────────────────────────────────────
  test-backend:
    name: Backend Smoke Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Start backend server (background)
        env:
          NODE_ENV: test
          PORT: 3001
          JWT_SECRET: ci-test-jwt-secret-do-not-use-in-prod
          CLIENT_KEY: ci-test-client-key
          LOG_LEVEL: error
        run: |
          node server.js &
          echo "BACKEND_PID=$!" >> $GITHUB_ENV
          # Wait for server to be ready (up to 20 seconds)
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3001/health > /dev/null 2>&1; then
              echo "✅ Backend is ready"
              break
            fi
            echo "Waiting for backend... ($i/20)"
            sleep 1
          done

      - name: Health check — liveness
        run: |
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" http://localhost:3001/health)
          [ "$STATUS" = "200" ] && echo "✅ /health OK" || (echo "❌ /health returned $STATUS" && exit 1)

      - name: Health check — readiness
        run: |
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" http://localhost:3001/health/ready)
          [ "$STATUS" = "200" ] && echo "✅ /health/ready OK" || (echo "❌ /health/ready returned $STATUS" && exit 1)

      - name: Health check — metrics
        run: |
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" http://localhost:3001/health/metrics)
          [ "$STATUS" = "200" ] && echo "✅ /health/metrics OK" || (echo "❌ /health/metrics returned $STATUS" && exit 1)

      - name: Auth endpoint reachable
        run: |
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" -X POST http://localhost:3001/api/auth/login \
            -H "Content-Type: application/json" \
            -H "x-client-key: ci-test-client-key" \
            -d '{"email":"nonexistent@test.com","password":"test"}')
          # Expect 401 (wrong creds) not 500
          [ "$STATUS" = "401" ] && echo "✅ Auth endpoint OK" || (echo "❌ Auth returned unexpected $STATUS" && exit 1)

      - name: Stop backend
        if: always()
        run: kill $BACKEND_PID 2>/dev/null || true

  # ──────────────────────────────────────────────────────────────
  #  4. Docker build & push (main branch only)
  # ──────────────────────────────────────────────────────────────
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [build-frontend, test-backend]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          target: backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract Docker metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          target: frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
            VITE_CLIENT_KEY=${{ secrets.VITE_CLIENT_KEY }}
            VITE_CONVEX_URL=${{ secrets.VITE_CONVEX_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────────────────────
  #  5. Deploy to Vercel (frontend — main only)
  # ──────────────────────────────────────────────────────────────
  deploy-vercel:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs: [build-frontend, test-backend]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          vercel build --prod --token=$VERCEL_TOKEN
          URL=$(vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN)
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "✅ Deployed to $URL"
