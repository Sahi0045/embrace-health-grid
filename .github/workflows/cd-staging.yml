name: CD — Staging

# ══════════════════════════════════════════════════════════════════════════════
#  Triggers
#  - Automatic: every push to the `develop` branch (after CI passes)
#  - Manual:    workflow_dispatch (with optional reason)
#
#  This workflow deploys the latest `staging` Docker images to the staging
#  environment and runs a post-deploy smoke test against the staging URL.
# ══════════════════════════════════════════════════════════════════════════════
on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual staging deploy"
        required: false
        default: "Manual trigger"

# Only one staging deploy at a time
concurrency:
  group: cd-staging
  cancel-in-progress: false

env:
  NODE_VERSION: "20"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  ENVIRONMENT: staging

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  #  Guard: confirm the CI pipeline passed on this commit
  # ────────────────────────────────────────────────────────────────────────────
  check-ci:
    name: "Confirm CI passed"
    runs-on: ubuntu-latest
    steps:
      - name: Check required CI workflows have completed successfully
        uses: actions/github-script@v7
        with:
          script: |
            const { data: checks } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
            });
            const ciGate = checks.check_runs.find(
              r => r.name === 'CI Gate (all checks passed)' && r.status === 'completed'
            );
            if (!ciGate || ciGate.conclusion !== 'success') {
              core.setFailed(
                `CI Gate has not passed for ${context.sha}. ` +
                `Status: ${ciGate?.conclusion ?? 'not found'}. ` +
                'Please wait for CI to complete before deploying.'
              );
            } else {
              core.info(`✅ CI Gate passed — proceeding with staging deploy`);
            }
        # Allow manual triggers even without a CI gate (operator's responsibility)
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' }}

  # ────────────────────────────────────────────────────────────────────────────
  #  Deploy frontend to Vercel preview (staging)
  # ────────────────────────────────────────────────────────────────────────────
  deploy-frontend-staging:
    name: "Deploy Frontend → Staging (Vercel)"
    runs-on: ubuntu-latest
    needs: check-ci
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.staging-url }}
    outputs:
      staging-url: ${{ steps.deploy.outputs.staging-url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      # If Vercel secrets are not configured, skip gracefully
      - name: Deploy to Vercel staging
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VITE_API_BASE_URL: ${{ secrets.STAGING_API_URL || secrets.VITE_API_BASE_URL }}
          VITE_CLIENT_KEY: ${{ secrets.VITE_CLIENT_KEY }}
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL || '' }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "⚠️ VERCEL_TOKEN not set — skipping Vercel staging deploy"
            echo "staging-url=https://staging.not-configured.example.com" >> $GITHUB_OUTPUT
            exit 0
          fi
          vercel pull --yes --environment=preview --token=$VERCEL_TOKEN
          vercel build --token=$VERCEL_TOKEN
          STAGING_URL=$(vercel deploy --prebuilt --token=$VERCEL_TOKEN)
          echo "staging-url=$STAGING_URL" >> $GITHUB_OUTPUT
          echo "✅ Staging frontend deployed to $STAGING_URL"

  # ────────────────────────────────────────────────────────────────────────────
  #  Deploy backend via Docker Compose to staging server
  # ────────────────────────────────────────────────────────────────────────────
  deploy-backend-staging:
    name: "Deploy Backend → Staging (Docker)"
    runs-on: ubuntu-latest
    needs: check-ci
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to staging server via SSH
        uses: appleboy/ssh-action@v1.0.3
        # Skip if staging SSH credentials are not configured
        if: ${{ secrets.STAGING_SSH_HOST != '' }}
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT || 22 }}
          script: |
            set -e
            cd /opt/embrace-health-staging

            # Pull latest staging images
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:staging
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:staging

            # Update docker-compose.staging.yml with new image tags
            export BACKEND_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:staging"
            export FRONTEND_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:staging"
            export GIT_SHA="${{ github.sha }}"

            # Rolling restart with zero-downtime
            docker compose -f docker-compose.yml -f docker-compose.staging.yml pull
            docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d --remove-orphans

            # Wait for backend to be healthy
            echo "Waiting for backend health check..."
            for i in $(seq 1 30); do
              if docker compose -f docker-compose.yml -f docker-compose.staging.yml \
                  exec -T backend wget -qO- http://localhost:3001/health > /dev/null 2>&1; then
                echo "✅ Backend healthy after ${i}s"
                break
              fi
              if [ "$i" = "30" ]; then
                echo "❌ Backend health check timed out"
                docker compose -f docker-compose.yml -f docker-compose.staging.yml logs backend
                exit 1
              fi
              sleep 1
            done

            # Prune old images
            docker image prune -f --filter "until=24h"
            echo "✅ Staging deployment complete"

      - name: Log deploy (no SSH configured)
        if: ${{ secrets.STAGING_SSH_HOST == '' }}
        run: |
          echo "ℹ️ STAGING_SSH_HOST not configured."
          echo "Docker images have been pushed to GHCR with :staging tag."
          echo "To deploy, configure STAGING_SSH_HOST/USER/KEY secrets."
          echo "  Backend:  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:staging"
          echo "  Frontend: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:staging"

  # ────────────────────────────────────────────────────────────────────────────
  #  Post-deploy smoke tests against staging URL
  # ────────────────────────────────────────────────────────────────────────────
  smoke-test-staging:
    name: "Smoke Tests → Staging"
    runs-on: ubuntu-latest
    needs: [deploy-frontend-staging, deploy-backend-staging]
    env:
      STAGING_API: ${{ secrets.STAGING_API_URL || 'http://localhost:3001' }}
    steps:
      - uses: actions/checkout@v4

      - name: Backend health probe
        run: |
          if [[ "$STAGING_API" == "http://localhost:3001" ]]; then
            echo "ℹ️ STAGING_API_URL not set — skipping remote health probe"
            exit 0
          fi
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" --max-time 10 "$STAGING_API/health" || echo "000")
          if [ "$STATUS" = "200" ]; then
            echo "✅ Staging backend /health → $STATUS"
          else
            echo "❌ Staging backend /health → $STATUS"
            exit 1
          fi

      - name: Frontend reachability probe
        run: |
          STAGING_URL="${{ needs.deploy-frontend-staging.outputs.staging-url }}"
          if [[ "$STAGING_URL" == *"not-configured"* ]]; then
            echo "ℹ️ Vercel staging URL not configured — skipping frontend probe"
            exit 0
          fi
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" --max-time 15 "$STAGING_URL" || echo "000")
          if [ "$STATUS" = "200" ]; then
            echo "✅ Staging frontend → $STATUS"
          else
            echo "⚠️ Staging frontend → $STATUS (may be warming up)"
          fi

      - name: Post deployment summary
        run: |
          echo "## Staging Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | \`${{ github.actor }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend URL | ${{ needs.deploy-frontend-staging.outputs.staging-url }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend API | ${{ env.STAGING_API }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Image | \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:staging\` |" >> $GITHUB_STEP_SUMMARY
