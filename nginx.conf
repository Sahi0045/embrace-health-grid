# ──────────────────────────────────────────────────────────────────────────────
# Nginx Configuration — Embrace Health Grid
# HIPAA-compliant transport layer: TLS 1.2+ only, HTTP→HTTPS redirect, WSS
# ──────────────────────────────────────────────────────────────────────────────

# ── HTTP → HTTPS redirect (HIPAA § 164.312(e)(1) — Transmission Security) ──
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Allow Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS — Primary HIPAA-compliant server ────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # ── TLS Configuration ─────────────────────────────────────────────────────
    # Certificates: mount at runtime via Docker/K8s volume or Let's Encrypt
    # In Docker: -v /etc/letsencrypt:/etc/letsencrypt:ro
    ssl_certificate     /etc/ssl/certs/fullchain.pem;
    ssl_certificate_key /etc/ssl/private/privkey.pem;

    # TLS 1.2+ only — HIPAA prohibits SSLv3, TLS 1.0, TLS 1.1
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Strong cipher suites (NIST SP 800-52 Rev. 2)
    ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers on;

    # OCSP stapling — reduces TLS handshake latency + improves cert validation
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver            1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout    5s;

    # DH param — prevents Logjam attack (generate with: openssl dhparam -out /etc/ssl/dhparam.pem 4096)
    # ssl_dhparam /etc/ssl/dhparam.pem;

    # Session resumption (performance + keeps TLS overhead low)
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;  # Disable for forward secrecy

    # ── HIPAA Security Headers ────────────────────────────────────────────────
    # HSTS — force HTTPS for 1 year, including subdomains
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    add_header X-Frame-Options       "DENY"                                  always;
    add_header X-Content-Type-Options "nosniff"                              always;
    add_header X-XSS-Protection      "1; mode=block"                        always;
    add_header Referrer-Policy       "no-referrer"                           always;
    add_header Permissions-Policy    "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Content Security Policy — prevents XSS exfiltration of PHI
    add_header Content-Security-Policy
        "default-src 'self'; \
         script-src 'self' 'unsafe-inline' 'unsafe-eval'; \
         style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; \
         font-src 'self' https://fonts.gstatic.com; \
         img-src 'self' data: blob:; \
         connect-src 'self' wss: https:; \
         frame-ancestors 'none'; \
         form-action 'self';" always;

    # Prevent PHI responses from being cached
    add_header Cache-Control "no-store" always;

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml application/wasm;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_vary on;

    # ── Static asset caching (non-PHI) ────────────────────────────────────────
    location ~* \.(js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Liveness probe ────────────────────────────────────────────────────────
    location = /health {
        return 200 '{"status":"ok","tls":true}';
        add_header Content-Type application/json;
    }

    # ── WebSocket proxy (ws:// → wss://) — HIPAA requires encrypted WS ───────
    location /ws {
        proxy_pass         http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;   # Backend sees HTTPS
        proxy_read_timeout 3600s;   # 1-hour WS timeout
        proxy_send_timeout 3600s;
    }

    # ── API proxy to Node.js backend ──────────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;   # Triggers HIPAA HTTPS check
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        # Strip sensitive headers from upstream before returning to client
        proxy_hide_header  X-Powered-By;

        # Rate limit API layer
        limit_req zone=api burst=20 nodelay;
    }

    # ── Health check proxy ─────────────────────────────────────────────────────
    location /health/ready {
        proxy_pass http://backend:3001/health/ready;
    }
    location /health/metrics {
        proxy_pass http://backend:3001/health/metrics;
        allow 10.0.0.0/8;   # Internal networks only
        allow 172.16.0.0/12;
        deny  all;
    }

    # ── SPA fallback — all routes → index.html ────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Nginx status (internal monitoring only) ───────────────────────────────
    location = /nginx_status {
        stub_status on;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        deny all;
    }
}

# ── Rate limiting zones (defined in http block — include from nginx.conf main) ─
# Add to /etc/nginx/nginx.conf http block if needed:
#   limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
