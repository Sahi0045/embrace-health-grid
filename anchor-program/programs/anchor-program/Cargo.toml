[package]
name = "anchor-program"
version = "0.1.0"
description = "Embrace Health Grid - Patient Merkle Root & Consent on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "anchor_program"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
anchor-debug = []

[dependencies]
anchor-lang = { version = "=0.28.0", features = ["init-if-needed"] }
# Pin transitive crypto deps to versions compatible with Cargo 1.75 (no edition2024)
block-buffer = "=0.10.4"
digest       = "=0.10.7"
sha2         = "=0.10.8"
